# SSH lab: one pod per OpenSSH release, each published on 127.0.0.1 only (19201-19207).
# The lab password exists only inside these local containers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: almaplab-ssh-nopenalty
data:
  lab.conf: |
    # OpenSSH 9.8+ throttles a source address that opens many connections without
    # authenticating (PerSourcePenalties). The checks open several such connections
    # in a row, so the lab turns the throttle off for the 9.8+ servers to keep the
    # cases independent. The README documents the throttle as a known limit.
    PerSourcePenalties no
---
apiVersion: v1
kind: Pod
metadata:
  name: almaplab-ssh84
spec:
  restartPolicy: Never
  containers:
    - name: ssh
      image: docker.io/linuxserver/openssh-server@sha256:b69aa9208b901de9ac9e01c881112cd8edec8988947fd53f8a6f562df389ca3a
      env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: USER_NAME
          value: labuser
        - name: PASSWORD_ACCESS
          value: "true"
        - name: USER_PASSWORD
          value: labonly
      ports:
        - containerPort: 2222
          hostPort: 19201
          hostIP: 127.0.0.1
---
